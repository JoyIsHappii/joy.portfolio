<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820"><rect width="1440" height="820" fill="#F8F6F0"/><defs>
<style>
.k{font-family:Arial,sans-serif}.serif{font-family:Georgia,serif}
.eyebrow{font-size:17px;font-weight:700;letter-spacing:3px;fill:#71834B}
.head{font-family:Georgia,serif;font-size:48px;fill:#3E352F}
.sub{font-family:Arial,sans-serif;font-size:21px;fill:#77736B}
.label{font-family:Arial,sans-serif;font-size:17px;font-weight:700;letter-spacing:1px;fill:#71834B}
.title{font-family:Arial,sans-serif;font-size:27px;font-weight:700;fill:#40372F}
.body{font-family:Arial,sans-serif;font-size:20px;fill:#716D65}
.small{font-family:Arial,sans-serif;font-size:16px;fill:#89847A}
.line{stroke:#D2CEC2;stroke-width:2;fill:none}
</style>
</defs>
<text x="88" y="86" class="eyebrow">03 / OPERATING MODES</text>
<text x="88" y="154" class="head">One selector. Three different states.</text>
<text x="88" y="198" class="sub">I separated the modes to make their purpose easier to compare.</text>
<g>
<rect x="88" y="290" width="390" height="300" fill="#E9EDE2"/>
<text x="128" y="350" class="label">01</text><text x="128" y="430" class="serif" font-size="58" fill="#526B35">AUTO</text>
<text x="128" y="485" class="title">Normal operation</text><text x="128" y="525" class="body">Programmed control</text>
<rect x="525" y="290" width="390" height="300" fill="#ECEBE5"/>
<text x="565" y="350" class="label">02</text><text x="565" y="430" class="serif" font-size="58" fill="#77776D">OFF</text>
<text x="565" y="485" class="title">Off state</text><text x="565" y="525" class="body">System set to OFF</text>
<rect x="962" y="290" width="390" height="300" fill="#F2E6DF"/>
<text x="1002" y="350" class="label" fill="#C8896D">03</text><text x="1002" y="430" class="serif" font-size="58" fill="#B8785C">MANUAL</text>
<text x="1002" y="485" class="title">Local operation</text><text x="1002" y="525" class="body">Documented fallback</text>
</g>
<text x="88" y="680" class="small">The three modes are shown as separate states, not as interchangeable options.</text>
</svg>