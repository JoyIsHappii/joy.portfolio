<text x="120" y="105" font-family="Arial,sans-serif" font-size="27" font-weight="700" letter-spacing="5" fill="#6D8663">SYSTEM RELATIONSHIP / HIGH-LEVEL VIEW</text>
<text x="120" y="190" font-family="Arial,sans-serif" font-size="55" font-weight="600" fill="#39463D">How people, controls, equipment, and room conditions connect</text>
