<text x="1325" y="502" font-family="Arial,sans-serif" font-size="36" font-weight="600" fill="#39463D" text-anchor="start">DDC controller</text>
<text x="1325" y="554" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#687268" text-anchor="start">Runs programmed logic</text>
<text x="1325" y="593" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#687268" text-anchor="start">Automatic control</text>
