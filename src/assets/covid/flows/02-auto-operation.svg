<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="820" viewBox="0 0 1800 820">
<rect width="1800" height="820" fill="#F7F5EF"/>
<text x="90" y="78" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="4" fill="#6F8062">02 / AUTO MODE</text>
<text x="90" y="132" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#403C32">A continuous operating and monitoring cycle</text>
<rect x="90" y="300" width="350" height="220" rx="18" fill="#FFFDF8" stroke="#D9D6CA" stroke-width="2"/>
<rect x="90" y="300" width="9" height="220" rx="4" fill="#6F8062"/>
<text x="118" y="338" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#6F8062">01 / ACCESS</text>
<text x="118" y="382" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#403C32">Open monitoring screen</text>
<text x="118" y="419" font-family="Arial,sans-serif" font-size="19" fill="#777365">Staff access the room</text>
<text x="118" y="446" font-family="Arial,sans-serif" font-size="19" fill="#777365">system dashboard.</text>
<path d="M440,410 L480,410" stroke="#6F8062" stroke-width="5" fill="none" stroke-linecap="round"/>
<path d="M467,400 L480,410 L467,420" stroke="#6F8062" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="505" y="300" width="350" height="220" rx="18" fill="#E7EBDD" stroke="#D9D6CA" stroke-width="2"/>
<rect x="505" y="300" width="9" height="220" rx="4" fill="#6F8062"/>
<text x="533" y="338" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#6F8062">02 / REVIEW</text>
<text x="533" y="382" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#403C32">Check room + equipment</text>
<text x="533" y="419" font-family="Arial,sans-serif" font-size="19" fill="#777365">Review mode, status, and</text>
<text x="533" y="446" font-family="Arial,sans-serif" font-size="19" fill="#777365">displayed room readings.</text>
<path d="M855,410 L895,410" stroke="#6F8062" stroke-width="5" fill="none" stroke-linecap="round"/>
<path d="M882,400 L895,410 L882,420" stroke="#6F8062" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="920" y="300" width="350" height="220" rx="18" fill="#E6EFF0" stroke="#D9D6CA" stroke-width="2"/>
<rect x="920" y="300" width="9" height="220" rx="4" fill="#6F8B91"/>
<text x="948" y="338" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#6F8B91">03 / CONTROL</text>
<text x="948" y="382" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#403C32">Use supported controls</text>
<text x="948" y="419" font-family="Arial,sans-serif" font-size="19" fill="#777365">System on/off is operated</text>
<text x="948" y="446" font-family="Arial,sans-serif" font-size="19" fill="#777365">through the monitoring screen.</text>
<path d="M1270,410 L1310,410" stroke="#6F8062" stroke-width="5" fill="none" stroke-linecap="round"/>
<path d="M1297,400 L1310,410 L1297,420" stroke="#6F8062" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="1335" y="300" width="350" height="220" rx="18" fill="#F2EBDD" stroke="#D9D6CA" stroke-width="2"/>
<rect x="1335" y="300" width="9" height="220" rx="4" fill="#A88454"/>
<text x="1363" y="338" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#A88454">04 / RUN</text>
<text x="1363" y="382" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#403C32">DDC runs programmed logic</text>
<text x="1363" y="419" font-family="Arial,sans-serif" font-size="19" fill="#777365">Equipment operates under</text>
<text x="1363" y="446" font-family="Arial,sans-serif" font-size="19" fill="#777365">the configured control logic.</text>
<path d="M1510 520 V650 H680 V535" stroke="#8D8A7B" stroke-width="5" fill="none" stroke-linecap="round"/>
<path d="M668 548 L680 530 L692 548" stroke="#8D8A7B" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="770" y="610" width="430" height="68" rx="34" fill="#F7F5EF" stroke="#D9D6CA" stroke-width="2"/>
<text x="985" y="653" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#6F8062">Continue monitoring during operation</text>
<text x="90" y="750" font-family="Arial,sans-serif" font-size="18" fill="#777365">The manual identifies AUTO as the normal mode and describes the monitoring screen as the operating interface (pp. 6, 10).</text>
</svg>