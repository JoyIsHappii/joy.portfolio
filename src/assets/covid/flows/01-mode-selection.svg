<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="790" viewBox="0 0 1800 790">
<rect width="1800" height="790" fill="#F7F5EF"/>
<text x="90" y="78" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="4" fill="#6F8062">01 / MODE SELECTION</text>
<text x="90" y="132" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#403C32">One selector determines how the system is operated</text>
<rect x="90" y="330" width="330" height="190" rx="18" fill="#FFFDF8" stroke="#D9D6CA" stroke-width="2"/>
<rect x="90" y="330" width="9" height="190" rx="4" fill="#6F8062"/>
<text x="118" y="368" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#6F8062">START</text>
<text x="118" y="412" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#403C32">Check selector position</text>
<text x="118" y="449" font-family="Arial,sans-serif" font-size="19" fill="#777365">Review the control cabinet</text>
<text x="118" y="476" font-family="Arial,sans-serif" font-size="19" fill="#777365">before changing the mode.</text>
<path d="M420,425 L560,425" stroke="#6F8062" stroke-width="5" fill="none" stroke-linecap="round"/>
<path d="M547,415 L560,425 L547,435" stroke="#6F8062" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="560" y="330" width="330" height="190" rx="18" fill="#F2EBDD" stroke="#D9D6CA" stroke-width="2"/>
<rect x="560" y="330" width="9" height="190" rx="4" fill="#A88454"/>
<text x="588" y="368" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#A88454">DECISION</text>
<text x="588" y="412" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#403C32">Choose operating mode</text>
<text x="588" y="449" font-family="Arial,sans-serif" font-size="19" fill="#777365">The selector has three</text>
<text x="588" y="476" font-family="Arial,sans-serif" font-size="19" fill="#777365">documented positions.</text>
<path d="M890 425 H1010 V220 H1110 M1010 425 H1110 M1010 425 V630 H1110" stroke="#8D8A7B" stroke-width="5" fill="none" stroke-linecap="round"/>
<rect x="1110" y="130" width="590" height="180" rx="18" fill="#E7EBDD" stroke="#D9D6CA" stroke-width="2"/>
<rect x="1110" y="130" width="9" height="180" rx="4" fill="#6F8062"/>
<text x="1138" y="168" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#6F8062">01 / AUTO</text>
<text x="1138" y="212" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#403C32">Normal operation</text>
<text x="1138" y="249" font-family="Arial,sans-serif" font-size="19" fill="#777365">DDC controller runs the programmed logic.</text>
<text x="1138" y="276" font-family="Arial,sans-serif" font-size="19" fill="#777365">System on/off is handled from the monitoring screen.</text>
<rect x="1110" y="335" width="590" height="180" rx="18" fill="#F4E8E2" stroke="#D9D6CA" stroke-width="2"/>
<rect x="1110" y="335" width="9" height="180" rx="4" fill="#B87968"/>
<text x="1138" y="373" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#B87968">02 / OFF</text>
<text x="1138" y="417" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#403C32">System stopped</text>
<text x="1138" y="454" font-family="Arial,sans-serif" font-size="19" fill="#777365">The system stops when the selector</text>
<text x="1138" y="481" font-family="Arial,sans-serif" font-size="19" fill="#777365">is moved to OFF.</text>
<rect x="1110" y="540" width="590" height="180" rx="18" fill="#E6EFF0" stroke="#D9D6CA" stroke-width="2"/>
<rect x="1110" y="540" width="9" height="180" rx="4" fill="#6F8B91"/>
<text x="1138" y="578" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#6F8B91">03 / MANUAL</text>
<text x="1138" y="622" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#403C32">Emergency fallback</text>
<text x="1138" y="659" font-family="Arial,sans-serif" font-size="19" fill="#777365">Used when the monitoring computer or</text>
<text x="1138" y="686" font-family="Arial,sans-serif" font-size="19" fill="#777365">DDC controller cannot be used.</text>
<text x="90" y="730" font-family="Arial,sans-serif" font-size="18" fill="#777365">Source: operation manual, selector-switch description (p. 6). AUTO is the normal operating mode; MANUAL is for emergency use.</text>
</svg>